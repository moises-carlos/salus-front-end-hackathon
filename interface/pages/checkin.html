<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SALUS — Check-in</title>

  <link rel="stylesheet" href="/style/global.css">
  <link rel="stylesheet" href="/style/checkin.css">
</head>
<body>

<div class="checkin-page">

  <div class="checkin-container">

    <div class="checkin-header">
      <h1>Como você está hoje?</h1>
      <p>Seu registro ajuda a entender seus padrões emocionais</p>
    </div>

    <div id="alert-container"></div>

    <!-- Mood -->
    <div class="mood-grid" id="mood-grid">
      <div class="mood-item" data-value="1">
        <div class="mood-emoji">😞</div>
        <div class="mood-label">Muito mal</div>
      </div>
      <div class="mood-item" data-value="2">
        <div class="mood-emoji">😕</div>
        <div class="mood-label">Mal</div>
      </div>
      <div class="mood-item" data-value="3">
        <div class="mood-emoji">😐</div>
        <div class="mood-label">Neutro</div>
      </div>
      <div class="mood-item" data-value="4">
        <div class="mood-emoji">🙂</div>
        <div class="mood-label">Bem</div>
      </div>
      <div class="mood-item" data-value="5">
        <div class="mood-emoji">😄</div>
        <div class="mood-label">Muito bem</div>
      </div>
    </div>

    <!-- Texto -->
    <div class="form-group">
      <label class="form-label">Quer escrever algo?</label>
      <textarea
        class="form-input checkin-textarea"
        id="note"
        placeholder="Descreva seu dia, pensamentos ou sentimentos..."
      ></textarea>
    </div>

    <!-- Ações -->
    <div class="checkin-actions">
      <button class="btn btn-outline" onclick="goBack()">Voltar</button>
      <button class="btn btn-primary" id="submit-checkin">Salvar check-in</button>
    </div>

  </div>

</div>

<script src="/scripts/auth.js"></script>
<script src="/scripts/checkin.js"></script>
</body>
</html>
