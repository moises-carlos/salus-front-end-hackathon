<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALUS — Dashboard</title>

    <link rel="stylesheet" href="/style/global.css">
    <link rel="stylesheet" href="/style/dashboard.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <span class="salus-logo">Sal<span>us</span></span>

            <nav class="sidebar-nav">
                <div class="nav-item active">Dashboard</div>
                <div class="nav-item" onclick="goToCheckin()">Check-in</div>
                <div class="nav-item" onclick="goToCrisis()">Modo Crise</div>
            </nav>

            <button class="btn btn-ghost logout-btn" onclick="logout()">
                Sair
            </button>
        </aside>

        <!-- Main -->
        <main class="dashboard-main">

            <div class="dashboard-header">
                <h1 id="welcome-text">Olá </h1>
                <div class="user-info" id="user-email"></div>
            </div>

            <div class="quick-actions">
                <div class="quick-card" onclick="goToCheckin()">
                    <h3>Check-in rápido</h3>
                    <p>Registre como você está agora</p>
                </div>

                <div class="quick-card" onclick="goToCrisis()">
                    <h3>Modo crise</h3>
                    <p>Acesso imediato a suporte</p>
                </div>
            </div>

            <div class="dashboard-grid">

                <div class="card-block card-highlight">
                    <h3>Seu bem-estar hoje</h3>
                    <p>Aqui vai entrar análise emocional vinda do backend.</p>
                </div>

                <div class="card-block card-small">
                    <h3>Último check-in</h3>
                    <p>Nenhum registro ainda</p>
                </div>

                <div class="card-block card-small">
                    <h3>Sequência</h3>
                    <p>0 dias seguidos</p>
                </div>

            </div>

        </main>

    </div>

    <script src="/scripts/api.js"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/dashboard.js"></script>
</body>

</html>
