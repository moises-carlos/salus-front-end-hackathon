<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SALUS — Login</title>
  <link rel="stylesheet" href="/style/global.css">
  <link rel="stylesheet" href="/style/login.css">
</head>
<body>

<div class="login-page">

  <div class="login-panel-brand">
    <div class="brand-logo">
      <span class="salus-logo">Sal<span>us</span></span>
    </div>

    <div class="brand-content">
      <h1>Cuide da sua mente com <em>inteligência</em> e presença</h1>
      <p>Monitoramento emocional contínuo, suporte em momentos difíceis e conexão com profissionais — tudo em um só lugar.</p>
    </div>

  </div>

  <div class="login-panel-form">
    <div class="login-form-wrapper">

      <div class="form-header">
        <h2>Bem-vindo de volta</h2>
        <p>Insira suas credenciais para continuar</p>
      </div>

      <div id="alert-container"></div>

      <form class="login-form" id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
          >
          <a href="#" class="forgot-link">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="btn-login">
          Entrar
        </button>
      </form>

      <div class="login-footer">
        Ainda não tem conta?
        <a href="/interface/pages/first-register.html">Criar conta gratuita</a>
      </div>

    </div>
  </div>

</div>

<script src="/scripts/api.js"></script>
<script src="/scripts/auth.js"></script>
</body>
</html>
